name: WaveEditor and Frontend CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  toolchain-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test toolchain downloads and server wiring
        run: go test ./internal/web ./internal/platform

      - name: Check documentation translations and partial coverage
        run: |
          python3 tools/test-doc-translations.py
          python3 tools/check-doc-translations.py
          python3 tools/check-doc-examples.py --links-only

      - name: Test server transfer with toolchain downloads
        run: python3 tools/test-server-transfer.py

  windows-installer:
    name: Installer / ${{ matrix.runner }} / Windows PowerShell
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned Wave and latest Vex installer and recovery
        shell: powershell
        run: ./frontend/tests/install_latest_test.ps1

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            frontend/package-lock.json

      - name: Check pinned Wave and latest Vex shell installer
        run: |
          bash frontend/tests/install_checksum_test.sh
          bash frontend/tests/install_latest_test.sh
          python3 frontend/tests/install_latest_test.py

      - name: Check pinned Wave and latest Vex PowerShell installer
        shell: pwsh
        run: ./frontend/tests/install_latest_test.ps1

      - name: Build frontend Docker stage
        run: docker build --target frontend-builder --progress=plain .

      - name: Verify pinned server toolchain in Docker
        run: docker build --target wave-toolchain --progress=plain .

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Run editor tests
        working-directory: editor
        run: npm test

      - name: Build editor
        working-directory: editor
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend documentation tests
        working-directory: frontend
        run: npm run test:docs

      - name: Run frontend toolchain tests
        working-directory: frontend
        run: npm run test:toolchains

      - name: Run browser playground host tests
        working-directory: frontend
        run: npm run test:playground

      - name: Build frontend
        working-directory: frontend
        run: npm run build
