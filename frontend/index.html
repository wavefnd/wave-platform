<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- wave:seo:start -->
    <meta name="description" content="The official home for the Wave programming language, documentation, releases, community, questions, source, and mail." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:title" content="Wave Programming Language" />
    <meta property="og:description" content="The official home for the Wave programming language." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wave" />
    <meta name="twitter:card" content="summary" />
    <title>Wave Programming Language</title>
    <!-- wave:seo:end -->
    <meta name="theme-color" content="#6654F1" />
    <script>
      (() => {
        const saved = localStorage.getItem('wave-theme')
        const dark = saved === 'black' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.coreuiTheme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0c0f' : '#6654F1'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
